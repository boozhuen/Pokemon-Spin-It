<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pokémon Lucky Draw</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />

</head>


<body class="broadcast-page">

  <main class="broadcast-shell">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <section class="broadcast-header">

      <div class="pokeball"></div>

      <p class="eyebrow">
        End-of-Year Function
      </p>

      <h1>
        Pokémon Lucky Draw
      </h1>

      <p id="prizeStatus">
        Waiting for the draw to begin...
      </p>

    </section>



    <!-- ==========================================
         WHEEL
    =========================================== -->

    <section class="broadcast-wheel">

      <div class="wheel-area">

        <div class="pointer"></div>

        <canvas
          id="wheelCanvas"
          width="700"
          height="700"
        ></canvas>

      </div>

    </section>



    <!-- ==========================================
         WINNER
    =========================================== -->

    <section
      id="winnerAnnouncement"
      class="broadcast-winner hidden"
    >

      <p class="winner-small">
        🎉 WINNER 🎉
      </p>

      <h2 id="winnerName"></h2>

      <span id="winnerGroup"></span>

    </section>


    <!-- ==========================================
         COMPLETED
    =========================================== -->

    <section
      id="drawComplete"
      class="broadcast-winner hidden"
    >

      <p class="winner-small">
        ⭐ LUCKY DRAW COMPLETE ⭐
      </p>

      <h2>
        Congratulations to all our winners!
      </h2>

    </section>

  </main>


  <!-- FIREBASE -->

  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
  </script>

  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js">
  </script>

  <script src="script.js"></script>

</body>

</html>
