<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pokémon Lucky Draw</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />

</head>


<body class="broadcast-page">

  <main class="broadcast-shell">


    <!-- =====================================================
         HEADER CARD
    ====================================================== -->

    <section class="broadcast-hero">

      <div
        class="pokeball broadcast-pokeball"
        aria-hidden="true"
      ></div>


      <p class="broadcast-eyebrow">
        P&amp;P YEAR END FUNCTION 2026
      </p>


      <h1>
        Pokémon Lucky Draw
      </h1>


      <p class="broadcast-subtitle">
        May the luckiest Trainer win!
      </p>


      <div
        id="prizeStatus"
        class="broadcast-status"
      >
        Waiting for the draw to begin...
      </div>

    </section>



    <!-- =====================================================
         WHEEL CARD
    ====================================================== -->

    <section class="broadcast-wheel-card">


      <div class="wheel-card-heading">

        <p>
          LUCKY DRAW
        </p>

        <h2>
          Who will be our next winner?
        </h2>

      </div>


      <div class="wheel-area">

        <div class="pointer"></div>


        <canvas
          id="wheelCanvas"
          width="700"
          height="700"
        ></canvas>

      </div>


    </section>



    <!-- =====================================================
         WINNER
    ====================================================== -->

    <section
      id="winnerAnnouncement"
      class="broadcast-winner hidden"
    >

      <p class="winner-small">
        🎉 WINNER 🎉
      </p>


      <h2 id="winnerName"></h2>


      <span id="winnerGroup"></span>

    </section>



    <!-- =====================================================
         DRAW COMPLETE
    ====================================================== -->

    <section
      id="drawComplete"
      class="broadcast-complete hidden"
    >

      <p class="complete-label">
        ⭐ LUCKY DRAW COMPLETE ⭐
      </p>


      <h2>
        Congratulations to all our winners!
      </h2>

    </section>


  </main>



  <!-- =====================================================
       FIREBASE
  ====================================================== -->

  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"
  ></script>


  <script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"
  ></script>


  <script src="script.js"></script>


</body>

</html>
